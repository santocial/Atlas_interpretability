[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-interpretability"
version = "0.1.0"
description = "Region-based SHAP explanations for image classifiers using atlas regions"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "torch",
    "shap",
]

[tool.setuptools]
packages = ["atlas_interpretability"]
